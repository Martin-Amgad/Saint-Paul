name: saint_paul
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.8.1

dependencies:
  http: ^1.2.2
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  gap: ^3.0.1
  go_router: ^17.0.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.1
  intl: ^0.20.2
  lottie: ^2.7.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  super_tooltip: ^2.1.1
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  package_info_plus: ^9.0.1
  excel: ^4.0.6
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/files/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf  
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 800
        
